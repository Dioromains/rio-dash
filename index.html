
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0b0d12;--bg1:#12151d;--bg2:#181c27;--bg3:#1f2434;
  --border:#252b3a;--border2:#323a52;--border3:#3d4768;
  --text:#d0d6e8;--text2:#7e8aa6;--text3:#404d6a;
  --accent:#4fc3f7;--gold:#f0c060;--green:#4caf82;--purple:#b07dff;--orange:#ff8c42;--red:#e05555;
  --enchant:#63e6a0;--gem:#e879f9;
  --font:'Rajdhani',sans-serif;--mono:'Share Tech Mono',monospace;
}
body{background:var(--bg0);color:var(--text);font-family:var(--font);font-size:15px}

/* ── SPLASH ── */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
.splash-logo{font-size:52px;font-weight:700;letter-spacing:.08em;color:#fff;font-family:var(--mono)}
.splash-logo span{color:var(--accent)}
.splash-sub{font-size:13px;letter-spacing:.2em;color:var(--text3);text-transform:uppercase;margin:8px 0 2rem;font-family:var(--mono)}
.splash-div{width:100%;max-width:440px;height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin-bottom:2rem}
.splash-form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px}
.splash-row{display:flex;gap:8px}
/* FIX: all splash inputs same explicit height */
.splash-row select,
.splash-row input,
.splash-form > input{
  height:44px;
  background:var(--bg2);
  border:1px solid var(--border2);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  padding:0 14px;
  border-radius:5px;
  outline:none;
  -webkit-appearance:none;
}
.splash-row select{width:88px;flex-shrink:0;padding:0 10px}
.splash-row input{flex:1}
.splash-form > input{width:100%}
.splash-row select:focus,.splash-row input:focus,.splash-form>input:focus{border-color:var(--accent)}
.splash-btn{height:44px;background:rgba(79,195,247,.1);border:1px solid var(--accent);color:var(--accent);font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:.1em;cursor:pointer;border-radius:5px}
.splash-btn:hover{background:rgba(79,195,247,.2)}
.splash-err{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.35);color:#f08080;padding:.5rem 1rem;border-radius:4px;font-size:13px}
.splash-hint{font-size:11px;color:var(--text3);font-family:var(--mono)}
.pinned-splash{width:100%;max-width:440px;margin-top:1.5rem}
.pinned-title{font-size:11px;color:var(--text3);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.pinned-list{display:flex;flex-direction:column;gap:6px}
.pinned-item{display:flex;align-items:center;gap:10px;padding:.5rem .875rem;background:var(--bg1);border:1px solid var(--border);border-radius:5px;cursor:pointer}
.pinned-item:hover{border-color:var(--border2)}
.pinned-av{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;overflow:hidden}
.pinned-av img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.pinned-meta{flex:1;min-width:0}
.pinned-name{font-size:14px;font-weight:600;color:var(--text)}
.pinned-sub{font-size:11px;color:var(--text3);font-family:var(--mono)}
.pinned-score{font-size:15px;font-weight:700;font-family:var(--mono)}
.pinned-del{font-size:15px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:3px}
.pinned-del:hover{color:var(--red)}

/* ── DASHBOARD ── */
.dash{display:none;padding:.875rem}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:.875rem;flex-wrap:wrap;padding:.5rem .75rem;background:var(--bg1);border:1px solid var(--border);border-radius:6px}
.topbar-brand{font-size:12px;letter-spacing:.12em;color:var(--text3);font-family:var(--mono);cursor:pointer;white-space:nowrap;font-weight:700;margin-right:4px}
.topbar-brand:hover{color:var(--accent)}
.topbar select,.topbar input[type=text]{
  height:34px;
  background:var(--bg2);
  border:1px solid var(--border2);
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  padding:0 8px;
  border-radius:4px;
  outline:none;
  -webkit-appearance:none;
}
.topbar select{width:72px}
.topbar input[type=text]{flex:1;min-width:80px}
.topbar select:focus,.topbar input[type=text]:focus{border-color:var(--accent)}
.tbtn{height:34px;padding:0 .875rem;background:transparent;border:1px solid;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;border-radius:4px;white-space:nowrap}
.tbtn-search{border-color:var(--accent);color:var(--accent)}.tbtn-search:hover{background:rgba(79,195,247,.1)}
.tbtn-pin{border-color:var(--gold);color:var(--gold)}.tbtn-pin:hover{background:rgba(240,192,96,.1)}
.tbtn-pin.pinned{background:rgba(240,192,96,.15)}
.tbtn-export{border-color:var(--green);color:var(--green)}.tbtn-export:hover{background:rgba(76,175,130,.1)}
.err-msg{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.35);color:#f08080;padding:.5rem 1rem;border-radius:4px;font-size:13px;margin-bottom:.75rem}

/* ── HERO ── */
.hero{background:var(--bg1);border:1px solid var(--border);border-radius:7px;padding:.875rem 1.25rem;display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.av{width:52px;height:52px;border-radius:50%;border:2px solid var(--border2);object-fit:cover;flex-shrink:0;background:var(--bg3)}
.av-init{width:52px;height:52px;border-radius:50%;border:2px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent);flex-shrink:0}
.hero-meta{flex:1;min-width:160px}
.hero-name{font-size:21px;font-weight:700;color:#fff;line-height:1.1}
.hero-sub{font-size:13px;color:var(--text2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.spec-pill{font-size:11px;padding:1px 7px;border-radius:3px;background:rgba(79,195,247,.12);color:var(--accent);border:1px solid rgba(79,195,247,.28);font-weight:600}
.faction-h{color:#e05555;font-weight:700}.faction-a{color:#4fc3f7;font-weight:700}
.hero-right{display:flex;align-items:center;gap:20px;flex-shrink:0;flex-wrap:wrap}
.role-row{display:flex;gap:14px}
.role-item{display:flex;flex-direction:column;align-items:center}
.role-lbl{font-size:10px;letter-spacing:.08em;color:var(--text3);text-transform:uppercase;margin-bottom:1px}
.role-val{font-size:15px;font-weight:700;font-family:var(--mono)}
.score-block{display:flex;flex-direction:column;align-items:flex-end}
.score-num{font-size:36px;font-weight:700;line-height:1;font-family:var(--mono)}
.score-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;justify-content:flex-end}
.score-lbl{font-size:10px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase}
.season-sel{height:24px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:11px;padding:0 6px;border-radius:3px;outline:none;cursor:pointer;max-width:160px}
.rio-link{font-size:11px;color:var(--accent);text-decoration:none;opacity:.65}
.rio-link:hover{opacity:1}
.delta-badge{font-size:12px;font-family:var(--mono);font-weight:700;padding:1px 7px;border-radius:3px;border:1px solid}
.delta-up{color:#4caf82;background:rgba(76,175,130,.12);border-color:rgba(76,175,130,.3)}
.delta-down{color:#e05555;background:rgba(224,85,85,.1);border-color:rgba(224,85,85,.25)}

/* ── SCORE BAR ── */
.score-bar-wrap{margin-bottom:10px;padding:.625rem 1rem;background:var(--bg1);border:1px solid var(--border);border-radius:7px}
.score-bar-track{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:6px}
.score-bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ── MAIN 3-COLUMN GRID ── */
.main-grid{display:grid;grid-template-columns:220px 1fr 1fr;gap:10px;margin-bottom:10px;align-items:start}
.col-left{display:flex;flex-direction:column;gap:10px}
.col-mid{display:flex;flex-direction:column;gap:10px}
.col-right{display:flex;flex-direction:column;gap:10px}

/* ── PANELS ── */
.panel{background:var(--bg1);border:1px solid var(--border);border-radius:7px;padding:.875rem 1.125rem}
.ph{display:flex;align-items:center;gap:7px;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ptitle{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.c{color:var(--accent)}.pdot.c{background:var(--accent)}
.g{color:var(--green)}.pdot.g{background:var(--green)}
.o{color:var(--gold)}.pdot.o{background:var(--gold)}
.p{color:var(--purple)}.pdot.p{background:var(--purple)}

/* ── STAT BLOCK ── */
.stat-block{display:flex;flex-direction:column;gap:6px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-key{font-size:12px;color:var(--text2)}
.stat-val{font-size:13px;font-weight:700;font-family:var(--mono);color:var(--text)}
.stat-val.accent{color:var(--accent)}

/* ── RUNS ── */
.tab-row{display:flex;gap:5px;margin-bottom:.625rem}
.xtab{font-size:12px;padding:4px 11px;border-radius:4px;cursor:pointer;background:var(--bg2);color:var(--text2);border:1px solid var(--border2);font-family:var(--font);font-weight:600}
.xtab.on{background:rgba(79,195,247,.1);color:var(--accent);border-color:rgba(79,195,247,.35)}
.run-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;padding:.375rem .75rem;background:var(--bg2);border:1px solid var(--border);border-radius:4px;margin-bottom:4px}
.run-row:hover{border-color:var(--border2)}
.run-name{font-size:13px;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.key-tag{padding:1px 8px;border-radius:3px;font-size:12px;font-weight:700;background:rgba(79,195,247,.1);color:var(--accent);border:1px solid rgba(79,195,247,.22);font-family:var(--mono);white-space:nowrap}
.run-sc{font-family:var(--mono);font-size:13px;min-width:50px;text-align:right;font-weight:600}
.run-tm{color:var(--text3);font-family:var(--mono);font-size:12px;min-width:38px;text-align:right}
.pip{width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:2px;vertical-align:middle}
.pip-g{background:#f0c060}.pip-s{background:#9e9e9e}.pip-b{background:#cd7f32}
.no-data{font-size:13px;color:var(--text3);padding:.5rem 0;font-family:var(--mono)}

/* ── RAID — FIX: more padding, name and pills on separate lines ── */
.raid-row{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:.625rem .875rem;   /* more vertical room */
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:4px;
  margin-bottom:6px;         /* gap between rows */
}
.raid-row:hover{border-color:var(--border2)}
.raid-name{color:var(--text);font-size:13px;font-weight:600;line-height:1.2}
.diff-pills{display:flex;gap:5px;flex-wrap:wrap}
.dpill{font-size:11px;padding:2px 8px;border-radius:3px;font-family:var(--mono);font-weight:700;border:1px solid}
.dp-m{background:rgba(240,192,96,.1);color:var(--gold);border-color:rgba(240,192,96,.3)}
.dp-h{background:rgba(79,195,247,.08);color:var(--accent);border-color:rgba(79,195,247,.25)}
.dp-n{background:rgba(76,175,130,.08);color:var(--green);border-color:rgba(76,175,130,.25)}

/* ── GEAR ── */
.gear-2col{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gear-slot{display:flex;align-items:flex-start;gap:8px;padding:.45rem .75rem;background:var(--bg2);border:1px solid var(--border);border-radius:4px;transition:border-color .15s}
.gear-slot:hover{border-color:var(--border2)}
.gicon{width:34px;height:34px;border-radius:4px;flex-shrink:0;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:16px;margin-top:1px}
.gicon img{width:34px;height:34px;object-fit:cover;border-radius:3px;display:none}
.gtext{min-width:0;flex:1}
.glbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:1px}
.gname{font-size:12px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.gilvl{font-size:11px;color:var(--accent);font-family:var(--mono);margin-top:1px}
.gear-slot.empty .gname{color:var(--text3)}
.gear-extras{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:3px}
.etag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);border-radius:3px;padding:1px 5px;width:fit-content;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid;line-height:1.4}
.etag-enchant{color:var(--enchant);background:rgba(99,230,160,.08);border-color:rgba(99,230,160,.22)}
.etag-gem{color:var(--gem);background:rgba(232,121,249,.08);border-color:rgba(232,121,249,.22)}
.etag-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.etag-enchant .etag-dot{background:var(--enchant)}
.etag-gem .etag-dot{background:var(--gem)}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--bg1);border:1px solid var(--border2);border-radius:8px;padding:1.5rem;max-width:360px;width:90%;text-align:center}
.modal-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:.75rem}
.modal-sub{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:1.25rem}
.modal-btns{display:flex;gap:8px;justify-content:center}
.mbtn{height:34px;padding:0 1.125rem;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;border-radius:4px;border:1px solid}
.mbtn-ok{background:rgba(76,175,130,.1);border-color:var(--green);color:var(--green)}
.mbtn-ok:hover{background:rgba(76,175,130,.2)}
.mbtn-ok:disabled{opacity:.5;cursor:default}
.mbtn-cancel{background:transparent;border-color:var(--border2);color:var(--text2)}
#export-progress{font-size:12px;color:var(--text3);font-family:var(--mono);margin-top:.75rem;min-height:1.2em}

@media(max-width:900px){.main-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.main-grid{grid-template-columns:1fr}}
</style>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="splash-logo">RIO<span>//</span>DASH</div>
  <div class="splash-sub">World of Warcraft · Character Dashboard</div>
  <div class="splash-div"></div>
  <div class="splash-form">
    <div class="splash-row">
      <select id="s-reg"><option value="eu">EU</option><option value="us">US</option><option value="kr">KR</option><option value="tw">TW</option></select>
      <input id="s-realm" type="text" placeholder="Realm (e.g. Ragnaros)">
    </div>
    <input id="s-name" type="text" placeholder="Character name">
    <button class="splash-btn" onclick="go()">Search character</button>
    <div id="splash-err"></div>
    <div class="splash-hint">// PRESS ENTER TO SEARCH</div>
  </div>
  <div class="pinned-splash" id="pinned-splash" style="display:none">
    <div class="pinned-title">// PINNED CHARACTERS</div>
    <div class="pinned-list" id="pinned-list"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dash">
  <div class="topbar">
    <span class="topbar-brand" onclick="backToSplash()">← RIO//DASH</span>
    <select id="d-reg"><option value="eu">EU</option><option value="us">US</option><option value="kr">KR</option><option value="tw">TW</option></select>
    <input id="d-realm" type="text" placeholder="Realm">
    <input id="d-name" type="text" placeholder="Character">
    <button class="tbtn tbtn-search" onclick="goFromDash()">Search</button>

  </div>

<div class="modal-bg" id="export-modal">
  <div class="modal">
    <div class="modal-title">Export character summary</div>
    <div class="modal-sub">Generates a clean PNG summary card with score, runs and raid progress.</div>
    <div class="modal-btns">
      <button class="mbtn mbtn-ok" id="export-ok-btn" onclick="doExport()">Generate PNG</button>
      <button class="mbtn mbtn-cancel" onclick="closeExport()">Cancel</button>
    </div>
    <div id="export-progress"></div>
  </div>
</div>
<canvas id="export-canvas" style="display:none"></canvas>

<script>
const SEASON_NAMES={
  'season-tww-3':'TWW Season 3','season-tww-2':'TWW Season 2','season-tww-1':'TWW Season 1',
  'season-df-4':'Dragonflight S4','season-df-3':'Dragonflight S3','season-df-2':'Dragonflight S2','season-df-1':'Dragonflight S1',
  'season-sl-4':'Shadowlands S4','season-sl-3':'Shadowlands S3','season-sl-2':'Shadowlands S2','season-sl-1':'Shadowlands S1',
  'season-bfa-4':'BfA S4','season-bfa-3':'BfA S3','season-bfa-2':'BfA S2','season-bfa-1':'BfA S1',
};
const SEASON_SLUGS=['current','season-tww-3','season-tww-2','season-tww-1',
  'season-df-4','season-df-3','season-df-2','season-df-1',
  'season-sl-4','season-sl-3','season-sl-2','season-sl-1',
  'season-bfa-4','season-bfa-3','season-bfa-2','season-bfa-1'];
const FIELDS='mythic_plus_scores_by_season:'+SEASON_SLUGS.join(':')+',mythic_plus_best_runs,mythic_plus_recent_runs,raid_progression,gear';
const TIER_LABELS=['0','500','750','1.5k','2k','2.5k','3k','3.5k'];
const SEC_STATS=['Critical Strike','Haste','Mastery','Versatility','Avoidance','Leech','Speed','Indestructible'];
const SLOT_ICONS={head:'⛑',neck:'📿',shoulder:'🛡',back:'🧥',chest:'👕',waist:'➰',wrist:'⌚',hands:'🧤',legs:'👖',feet:'👟',finger1:'💍',finger2:'💍',trinket1:'🔮',trinket2:'🔮',mainhand:'⚔',offhand:'🗡'};
const SLOT_LABELS_MAP={head:'Head',neck:'Neck',shoulder:'Shoulder',back:'Back',chest:'Chest',waist:'Waist',wrist:'Bracers',hands:'Hands',legs:'Legs',feet:'Feet',finger1:'Ring 1',finger2:'Ring 2',trinket1:'Trinket 1',trinket2:'Trinket 2',mainhand:'Main hand',offhand:'Off hand'};

let _seasons=[],_activeSeason=0,_currentChar=null,_currentData=null,_currentReg='eu';
const STORE_KEY='rio_dash_v3';
function loadStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch{return{}}}
function saveStore(s){try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch{}}

function rioColor(s){
  if(!s||s<=0)return'var(--text3)';
  if(s>=3500)return'#e268a8';if(s>=3000)return'#ff8c42';if(s>=2500)return'#b07dff';
  if(s>=2000)return'#4fc3f7';if(s>=1500)return'#4caf82';if(s>=750)return'#c8cdd8';
  return'#7a8099';
}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
function pips(n){if(!n)return'';const c=n===3?'pip-g':n===2?'pip-s':'pip-b';return Array(n).fill(`<span class="pip ${c}"></span>`).join('')}
function stripHtml(h){return h?h.replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').trim():''}
function charKey(r,realm,name){return`${r}:${realm.toLowerCase()}:${name.toLowerCase()}`}

function parseEnchantStats(tooltipHtml){
  if(!tooltipHtml)return[];
  const lines=tooltipHtml.split(/<br\s*\/?>/i);
  const results=[];
  for(const line of lines){
    const text=stripHtml(line).trim();
    if(/^\+\d/.test(text)&&SEC_STATS.some(s=>text.includes(s)))results.push(text);
  }
  return results;
}

function buildScoreBar(score){

function getDelta(r,realm,name,score){

}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej();i.src=src;setTimeout(()=>rej(),4000)})}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

function parseSeasons(raw){
  if(!raw)return[];const arr=Array.isArray(raw)?raw:Object.values(raw);const result=[];
  arr.forEach((entry,i)=>{if(!entry)return;const slug=SEASON_SLUGS[i]||('season-'+i);const sc=entry.scores||entry||{};const all=sc.all||0,tank=sc.tank||0,healer=sc.healer||0,dps=sc.dps||0;if(slug==='current'||all>0||tank>0||healer>0||dps>0)result.push({slug,label:slug==='current'?'Current Season':(SEASON_NAMES[slug]||slug),all,tank,healer,dps});});return result;
}

function raidList(prog){

async function loadItemExtras(items){

}

  else document.getElementById('d-out').innerHTML='<div class="no-data" style="padding:3rem 0;text-align:center">// FETCHING...</div>';
  try{
    const url=`https://raider.io/api/v1/characters/profile?region=${encodeURIComponent(reg)}&realm=${encodeURIComponent(realm)}&name=${encodeURIComponent(name)}&fields=${encodeURIComponent(FIELDS)}`;
    const r=await fetch(url);const data=await r.json();
    if(!r.ok){const msg=data.message||'Character not found.';if(isFromSplash){backToSplash();document.getElementById('splash-err').innerHTML=`<div class="splash-err">${msg}</div>`;}else{document.getElementById('d-err').innerHTML=`<div class="err-msg">${msg}</div>`;document.getElementById('d-out').innerHTML='';}return;}
    render(data,reg);
  }catch(e){const msg='Network error.';if(isFromSplash){backToSplash();document.getElementById('splash-err').innerHTML=`<div class="splash-err">${msg}</div>`;}else{document.getElementById('d-err').innerHTML=`<div class="err-msg">${msg}</div>`;document.getElementById('d-out').innerHTML='';}}
}
function go(){fetchChar(document.getElementById('s-reg').value,document.getElementById('s-realm').value.trim(),document.getElementById('s-name').value.trim(),true)}
function goFromDash(){fetchChar(document.getElementById('d-reg').value,document.getElementById('d-realm').value.trim(),document.getElementById('d-name').value.trim(),false)}
document.getElementById('s-name').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
document.getElementById('d-name').addEventListener('keydown',e=>{if(e.key==='Enter')goFromDash()});
renderPinnedSplash();
</script>
